architecture: pmfDiT_B_128
image_size: 2048
image_channels: 1
num_classes: 1
epochs: 500
global_batch_size: 16
optimizer: {name: AdamW, lr: 4.0e-4, betas: [0.9, 0.95]}
schedule: {name: warmup_cosine, warmup_epochs: 10}
ema_decay: 0.9999
seed: 42
pmf: {P_mean: -0.4, P_std: 1.0, data_proportion: 0.5, cfg_beta: 1.0}
adaptive_norm: {p: 1.0, epsilon: 0.01}
losses:
  ms_ssim: {weight: 0.0}
  lpips: {weight: 0.4, network: vgg, crop_size: 224, maximum_t: 0.8}
augmentation: false
split: {train_scans: [1, 2, 3], train_slices: 3003, val_scans: [4], val_slices: 1001}
